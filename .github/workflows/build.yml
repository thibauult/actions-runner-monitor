name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh --zip --dmg

      - name: Check discovery and parsing run
        run: '"build/Actions Runner Monitor.app/Contents/MacOS/ActionsRunnerMonitor" --dump'

      - uses: actions/upload-artifact@v4
        with:
          name: ActionsRunnerMonitor
          path: |
            build/ActionsRunnerMonitor.zip
            build/ActionsRunnerMonitor.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/ActionsRunnerMonitor.dmg build/ActionsRunnerMonitor.zip --generate-notes
